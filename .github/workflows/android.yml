name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply repository fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          sed -i 's/gemini-3.5-flash/gemini-2.5-flash/g' app/src/main/java/com/example/ui/GeminiClient.kt
          if ! grep -q 'debug.keystore").exists()' app/build.gradle.kts; then
            sed -i 's/signingConfig = signingConfigs.getByName("debugConfig")/if (file("${rootDir}\/debug.keystore").exists()) { signingConfig = signingConfigs.getByName("debugConfig") }/g' app/build.gradle.kts
          fi
          git rm -rf --ignore-unmatch workspace
          if ! git diff --cached --quiet || ! git diff --quiet; then
            git add -A
            git commit -m "fix: update Gemini model to 2.5-flash, guard debug keystore, and remove temp workspace scripts"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate debug.keystore if missing
        run: |
          if [ ! -f "debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare .env file
        env:
          SECRET_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$SECRET_GEMINI_KEY" ]; then
            echo "GEMINI_API_KEY=$SECRET_GEMINI_KEY" > .env
          else
            cp -n .env.example .env || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
