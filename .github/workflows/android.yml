name: Android CI

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete app files from commit 34a2a78
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout 34a2a78 -- app/src/main/java/com/example/ui/LibraryApp.kt
          git checkout 34a2a78 -- app/src/main/java/com/example/ui/LibraryViewModel.kt
          git checkout 34a2a78 -- app/src/main/java/com/example/data/LibraryRepository.kt
          git rm -f --ignore-unmatch app/src/main/java/com/example/ui/BookManagementScreen.kt
          git rm -f --ignore-unmatch app/src/main/java/com/example/ui/BookManagementScreens.kt
          git rm -f --ignore-unmatch app/src/main/java/com/example/ui/AuthScreens.kt
          if ! git diff --cached --quiet || ! git diff --quiet; then
            git add -A
            git commit -m "fix: restore complete application files from 34a2a78"
            git push origin HEAD:main
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare .env file
        run: cp -n .env.example .env || true

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
