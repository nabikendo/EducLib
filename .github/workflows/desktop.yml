name: Desktop (Windows e Linux)

on:
  pull_request:
    branches: [ "main" ]
    paths: [ "desktop/**", "shared/**", ".github/workflows/desktop.yml" ]
  push:
    branches: [ "main" ]
    paths: [ "desktop/**", "shared/**", ".github/workflows/desktop.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04: as dependências do .deb ganham os nomes do 22.04 (ex.: libasound2), que o
          # 24.04 também aceita. Assim o pacote instala no Zorin OS 17 (base 22.04) e no 18 (base 24.04).
          - os: ubuntu-22.04
            tasks: packageDeb
            artifact: EducLib-linux-deb
            files: desktop/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            tasks: packageMsi packageExe
            artifact: EducLib-windows
            files: |
              desktop/build/compose/binaries/main/msi/*.msi
              desktop/build/compose/binaries/main/exe/*.exe
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.1'

      - name: Run desktop tests
        run: gradle test --stacktrace

      - name: Build installers
        run: gradle ${{ matrix.tasks }} --stacktrace

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 30
